<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scroll Hero Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO SECTION -->
    <section class="hero">

        <!-- Headline -->
        <h1 class="hero-title">
            WELCOME&nbsp;&nbsp; ITZFIZZ
        </h1>

        <!-- Main Visual -->
        <div class="visual">
            <img src="car.png" alt="Car">
        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat">
                <h2>95%</h2>
                <p>Customer Impact</p>
            </div>

            <div class="stat">
                <h2>87%</h2>
                <p>Performance</p>
            </div>

            <div class="stat">
                <h2>92%</h2>
                <p>Engagement</p>
            </div>

        </div>

    </section>


    <!-- SECOND SECTION -->
    <section class="about">

        <h2>Built for Impact</h2>

        <p>
            A smooth interactive experience powered by modern
            web animation and scroll-based interactions.
        </p>

    </section>


    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>
</html>
